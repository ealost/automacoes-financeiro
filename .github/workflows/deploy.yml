name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages precisa destas permissões e concorrência.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------
  # Publica o site estático no GitHub Pages (funciona já com os dados
  # de exemplo — não precisa de nenhum secret).
  # Requer: Settings -> Pages -> Source = "GitHub Actions".
  # --------------------------------------------------------------------
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  # --------------------------------------------------------------------
  # Publica no Firebase Hosting. Só roda quando os secrets existem
  # (mapeados para env, pois o contexto `secrets` não é válido em `if:`).
  # --------------------------------------------------------------------
  firebase:
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.FIREBASE_PROJECT_ID != '' }}
      FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.HAS_FIREBASE == 'true' }}

      - name: Write firebase-config.js
        if: ${{ env.HAS_FIREBASE == 'true' && env.FIREBASE_WEB_CONFIG != '' }}
        run: printf '%s' "$FIREBASE_WEB_CONFIG" > assets/js/firebase-config.js

      - name: Deploy to Firebase Hosting
        if: ${{ env.HAS_FIREBASE == 'true' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Firebase pulado
        if: ${{ env.HAS_FIREBASE != 'true' }}
        run: echo "::notice::Firebase pulado — configure FIREBASE_SERVICE_ACCOUNT e FIREBASE_PROJECT_ID para publicar no Hosting."
